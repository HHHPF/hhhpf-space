<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瓦罗兰特集锦 - HHHPf's Space</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="dot"></span> HHHPf's Space</a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-section="home">首页</a>
        <a href="essays.html" data-section="essays">随笔</a>
        <a href="gallery.html" data-section="gallery">自拍</a>
        <a href="valorant.html" class="active" data-section="valorant">瓦罗兰特</a>
        <a href="about.html" data-section="about">关于我</a>
      </div>
      <div class="nav-actions">
        <a href="/admin/login.html" class="admin-link" title="管理网站">管理</a>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">☀</button>
      </div>
    </div>
  </nav>

  <div class="container valorant-container">
    <div class="valorant-header">
      <h1>无畏契约 · 精彩集锦</h1>
      <p style="color:var(--text-secondary); font-style:italic; margin-top:4px;">高光时刻 · 五杀残局 · 英雄操作</p>
    </div>

    <div class="video-section">
      <h2>精彩视频</h2>
      <div class="video-grid" id="videoGrid">
        <div class="loading">加载中</div>
      </div>
    </div>

    <div class="screenshots-section">
      <h2>高光截图</h2>
      <div class="gallery-filters" id="screenshotDateFilter" style="justify-content:flex-start;margin-bottom:var(--space-lg);"></div>
      <div class="screenshots-grid" id="screenshotsGrid">
        <div class="loading">加载中</div>
      </div>
    </div>
  </div>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <img src="" alt="" id="lightboxImg">
    <p class="caption" id="lightboxCaption"></p>
  </div>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 HHHPf's Space</p></div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/valorant.js"></script>
</body>
