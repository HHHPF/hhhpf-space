<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理随笔 - HHHPf's Space</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
<div class="admin-layout">
  <nav class="sidebar">
    <div class="logo">⚙️ 后台管理</div>
    <a href="dashboard.html">📊 仪表盘</a>
    <a href="essays.html" class="active">📝 管理随笔</a>
    <a href="gallery.html">📷 管理自拍</a>
    <a href="valorant.html">🎯 管理集锦</a>
    <button class="logout-btn" onclick="logout()">🚪 退出登录</button>
  </nav>

  <main class="main-content">
    <h1>📝 管理随笔</h1>
    <p class="subtitle">新增、编辑或删除文章</p>

    <!-- 新建按钮 -->
    <button class="btn btn-primary" onclick="showEditor()" style="margin-bottom:20px;">+ 写新随笔</button>

    <!-- 已有文章列表 -->
    <div class="card">
      <h2>已有文章</h2>
      <ul class="item-list" id="essayList"><li>加载中...</li></ul>
    </div>

    <!-- 编辑器弹窗 -->
    <div class="lightbox" id="editorModal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.6); overflow-y:auto; padding:40px 20px;">
      <div class="card" style="max-width:800px; margin:0 auto;">
        <h2 id="editorTitle">新建随笔</h2>
        <input type="hidden" id="editSlug">
        <div class="form-row">
          <div class="form-group">
            <label>标题 *</label>
            <input type="text" id="essayTitle" placeholder="文章标题">
          </div>
          <div class="form-group">
            <label>标识（slug）*</label>
            <input type="text" id="essaySlug" placeholder="英文短标识，如 my-post">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>分类</label>
            <select id="essayCategory">
              <option>日常碎碎念</option>
              <option>生活感悟</option>
              <option>游戏随笔</option>
            </select>
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="essayDate">
          </div>
        </div>
        <div class="form-group">
          <label>封面 Emoji</label>
          <input type="text" id="essayEmoji" placeholder="如 ✍️  🌸  🎯" maxlength="4">
        </div>
        <div class="form-group">
          <label>摘要</label>
          <input type="text" id="essayExcerpt" placeholder="一句话描述">
        </div>
        <div class="form-group">
          <label>正文（Markdown）</label>
          <textarea id="essayContent" rows="14" placeholder="支持 Markdown 语法..."></textarea>
        </div>
        <details style="margin-bottom:16px;">
          <summary style="cursor:pointer; color:var(--text2); font-size:14px;">👁 预览</summary>
          <div id="preview" style="margin-top:12px; padding:16px; border:1px solid var(--border); border-radius:8px; line-height:1.8;"></div>
        </details>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="saveEssay()">💾 保存</button>
          <button class="btn btn-outline" onclick="closeEditor()">取消</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="admin.js"></script>
<script>
  checkAuth();

  let editingSlug = null;

  // 加载列表
  async function loadList() {
    const resp = await fetch('/api/essays');
    const essays = await resp.json();
    const el = document.getElementById('essayList');
    if (!essays.length) {
      el.innerHTML = '<li style="color:var(--text2); text-align:center; padding:24px;">暂无文章</li>';
      return;
    }
    el.innerHTML = essays.map((e, i) => `
      <li>
        <div class="item-info">
          <div class="item-title">${e.coverEmoji || '📝'} ${esc(e.title)}</div>
          <div class="item-meta">${e.date} · ${e.category} · ${e.slug}</div>
        </div>
        <div class="item-actions">
          <button class="btn btn-outline btn-sm" onclick="editEssay('${esc(e.slug)}')">✏️ 编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEssay('${esc(e.slug)}')">🗑 删除</button>
        </div>
      </li>
    `).join('');
  }

  function showEditor() {
    editingSlug = null;
    document.getElementById('editorTitle').textContent = '新建随笔';
    document.getElementById('editSlug').value = '';
    document.getElementById('essayTitle').value = '';
    document.getElementById('essaySlug').value = '';
    document.getElementById('essaySlug').disabled = false;
    document.getElementById('essayCategory').value = '日常碎碎念';
    document.getElementById('essayDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('essayEmoji').value = '📝';
    document.getElementById('essayExcerpt').value = '';
    document.getElementById('essayContent').value = '';
    document.getElementById('preview').innerHTML = '';
    document.getElementById('editorModal').style.display = 'block';
  }

  function closeEditor() {
    document.getElementById('editorModal').style.display = 'none';
  }

  async function editEssay(slug) {
    const resp = await fetch(`/api/essays/${slug}`);
    if (!resp.ok) { toast('加载失败'); return; }
    const e = await resp.json();
    editingSlug = slug;
    document.getElementById('editorTitle').textContent = '编辑随笔';
    document.getElementById('editSlug').value = slug;
    document.getElementById('essayTitle').value = e.title || '';
    document.getElementById('essaySlug').value = e.slug || '';
    document.getElementById('essaySlug').disabled = true;
    document.getElementById('essayCategory').value = e.category || '日常碎碎念';
    document.getElementById('essayDate').value = e.date || '';
    document.getElementById('essayEmoji').value = e.coverEmoji || '📝';
    document.getElementById('essayExcerpt').value = e.excerpt || '';
    document.getElementById('essayContent').value = e.content || '';
    updatePreview();
    document.getElementById('editorModal').style.display = 'block';
  }

  async function saveEssay() {
    const body = {
      title: document.getElementById('essayTitle').value.trim(),
      slug: (editingSlug || document.getElementById('essaySlug').value.trim()),
      category: document.getElementById('essayCategory').value,
      date: document.getElementById('essayDate').value,
      coverEmoji: document.getElementById('essayEmoji').value,
      excerpt: document.getElementById('essayExcerpt').value.trim(),
      content: document.getElementById('essayContent').value
    };
    if (!body.title || !body.slug) { toast('标题和标识不能为空'); return; }

    const resp = await fetch('/api/essays', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (data.success) {
      toast(editingSlug ? '✅ 已更新' : '✅ 已发布');
      closeEditor();
      loadList();
    } else {
      toast('❌ ' + (data.error || '保存失败'));
    }
  }

  async function deleteEssay(slug) {
    if (!confirm(`确定删除 "${slug}"？此操作不可撤销。`)) return;
    await fetch(`/api/essays/${slug}`, { method: 'DELETE' });
    toast('🗑 已删除');
    loadList();
  }

  // 实时预览
  document.getElementById('essayContent').addEventListener('input', updatePreview);
  function updatePreview() {
    const md = document.getElementById('essayContent').value;
    document.getElementById('preview').innerHTML = typeof marked !== 'undefined'
      ? marked.parse(md) : '<pre>' + esc(md) + '</pre>';
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  loadList();
</script>
</body>
</html>
