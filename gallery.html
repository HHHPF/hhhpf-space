      <a href="index.html" class="logo"><span class="dot"></span> HHHPf's Space</a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-section="home">首页</a>

        <a href="about.html" data-section="about">关于我</a>

      <div class="nav-actions">
        <a href="http://localhost:3001/admin/login.html" class="admin-link" title="管理网站">管理</a>

  <div class="container gallery-container">
    <div class="gallery-header">

      <button class="category-chip active" data-group="">全部</button>

    <div class="masonry" id="masonryGrid">

    </div>

  <div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <button class="nav-btn prev" id="lightboxPrev">❮</button>
    <button class="nav-btn next" id="lightboxNext">❯</button>
    <img src="" alt="" id="lightboxImg">
    <p class="caption" id="lightboxCaption"></p>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 HHHPf's Space</p></div>
