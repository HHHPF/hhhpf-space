<body>
  <nav class="navbar">

      <a href="index.html" class="logo"><span class="dot"></span> HHHPf's Space</a>

        <a href="about.html">👤 关于我</a>

      <div class="nav-actions">
        <a href="http://localhost:3001/admin/login.html" class="admin-link" title="管理网站">⚙️</a>
        <button class="theme-toggle" id="themeToggle" title="切换阅读模式">💡</button>

    </div>

  <div class="container gallery-container">

      <button class="category-chip active" data-group="">全部</button>

    </div>

  <!-- 灯箱弹窗 -->
  <div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <button class="nav-btn prev" id="lightboxPrev">❮</button>
    <button class="nav-btn next" id="lightboxNext">❯</button>
    <img src="" alt="" id="lightboxImg">

  <footer class="footer">
